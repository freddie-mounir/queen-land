<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="">
    <title>المنتجات | كوين لاند جروب</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Cairo', 'sans-serif'] }, colors: { queen: { gold: '#f7c800', ink: '#232323', body: '#6f6f6f', mist: '#f7f9fb', footer: '#1c1c1c' } } } } };
    </script>
    <link rel="stylesheet" href="./assets/site.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script>
        (function () {
            if (window.gsap && window.ScrollTrigger && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                document.documentElement.classList.add('gsap-init');
                setTimeout(function () { document.documentElement.classList.remove('gsap-init'); }, 3000);
            }
        })();
    </script>
</head>
<body class="antialiased" data-page="products" data-page-title="productsPageTitle" data-page-description="productsPageDescription">
    <site-header></site-header>
    <main class="pt-20">
        <section class="hero-section flex min-h-[42vh] items-center justify-center px-4 text-center"><div class="max-w-4xl py-16"><p data-i18n="products" class="mb-3 font-bold text-queen-gold"></p><h1 data-i18n="newProducts" class="mb-5 text-4xl font-extrabold text-white md:text-6xl"></h1><p data-i18n="productPageIntro" class="text-xl font-semibold text-gray-100 md:text-2xl"></p></div></section>
        <section class="bg-queen-mist py-12"><div class="mx-auto max-w-7xl px-4 text-center sm:px-6 lg:px-8"><p data-i18n="productPageLead" class="mx-auto max-w-3xl text-lg leading-8 text-queen-body"></p></div></section>
        <section class="bg-queen-mist pb-20"><div class="mx-auto grid max-w-7xl grid-cols-1 gap-6 px-4 sm:grid-cols-2 sm:px-6 lg:grid-cols-4 lg:px-8">
            <article id="suspensions" class="hover-card overflow-hidden rounded-2xl border border-gray-100 bg-white shadow-sm"><img data-i18n-alt="suspensions" src="https://queenland-group.com/images/Products/2023-08-10-07-22-20WhatsApp%20Image%202023-08-10%20at%2010.20.27%20AM.jpeg" alt="" class="h-48 w-full object-cover"><div class="p-6"><h2 data-i18n="suspensions" class="mb-4 text-xl font-extrabold text-queen-ink"></h2><ul class="space-y-2 text-sm leading-relaxed"><li data-i18n="productSuspension20"></li><li data-i18n="productSuspension22"></li><li data-i18n="productSuspension19"></li></ul></div></article>
            <article id="liquid-fertilizers" class="hover-card overflow-hidden rounded-2xl border border-gray-100 bg-white shadow-sm"><img data-i18n-alt="liquid" src="https://queenland-group.com/images/Products/2023-08-09-11-09-07_WhatsApp%20Image%202023-08-09%20at%202.08.24%20PM.jpeg" alt="" class="h-48 w-full object-cover"><div class="p-6"><h2 data-i18n="liquid" class="mb-4 text-xl font-extrabold text-queen-ink"></h2><ul class="space-y-2 text-sm leading-relaxed"><li data-i18n="bigFood"></li><li data-i18n="queenRoots"></li><li data-i18n="phantomPower"></li><li data-i18n="apache"></li></ul></div></article>
            <article id="calcium-compounds" class="hover-card overflow-hidden rounded-2xl border border-gray-100 bg-white shadow-sm"><img data-i18n-alt="calcium" src="https://queenland-group.com/images/Products/2023-08-09-10-31-18_WhatsApp%20Image%202023-08-09%20at%201.29.43%20PM.jpeg" alt="" class="h-48 w-full object-cover"><div class="p-6"><h2 data-i18n="calcium" class="mb-4 text-xl font-extrabold text-queen-ink"></h2><ul class="space-y-2 text-sm leading-relaxed"><li data-i18n="borocal"></li><li data-i18n="magnocal"></li><li data-i18n="moksal"></li><li data-i18n="nitrocal"></li></ul></div></article>
            <article id="superphosphates" class="hover-card overflow-hidden rounded-2xl border border-gray-100 bg-white shadow-sm"><img data-i18n-alt="superphosphate" src="https://queenland-group.com/images/Products/2023-08-09-10-48-03_WhatsApp%20Image%202023-08-09%20at%201.46.18%20PM.jpeg" alt="" class="h-48 w-full object-cover"><div class="p-6"><h2 data-i18n="superphosphate" class="mb-4 text-xl font-extrabold text-queen-ink"></h2><ul class="space-y-2 text-sm leading-relaxed"><li data-i18n="singleSuperphosphate"></li><li data-i18n="tripleSuperphosphate"></li></ul></div></article>
        </div><p data-i18n="productRange" class="mx-auto mt-8 max-w-4xl px-4 text-center text-sm leading-7 text-queen-body"></p></section>
        <section class="bg-white py-14 text-center"><div class="mx-auto max-w-3xl px-4"><h2 data-i18n="contact" class="mb-4 text-2xl font-extrabold text-queen-ink"></h2><a data-i18n="messageUs" href="./contact.html" class="inline-flex rounded-full bg-queen-gold px-7 py-3 font-bold text-queen-ink transition hover:bg-yellow-400"></a></div></section>
        <section class="bg-queen-mist py-16 md:py-20">
            <div class="mx-auto max-w-3xl px-4 sm:px-6">
                <div class="mb-10 text-center" data-aos="fade-up">
                    <p data-i18n="products" class="mb-2 text-sm font-extrabold uppercase tracking-widest text-queen-gold"></p>
                    <h2 data-i18n="quoteRequestTitle" class="text-3xl font-extrabold text-queen-ink md:text-4xl"></h2>
                    <p data-i18n="quoteRequestLead" class="mx-auto mt-4 max-w-2xl leading-8 text-queen-body"></p>
                </div>
                <form data-quote-form novalidate class="grid gap-5 rounded-3xl border border-gray-100 bg-white p-6 shadow-sm sm:p-8">
                    <div class="grid gap-5 sm:grid-cols-2">
                        <label class="flex flex-col gap-2 text-start">
                            <span data-i18n="formCategory" class="font-bold text-queen-ink"></span>
                            <select data-quote-category name="category" required class="quote-field">
                                <option value="" disabled selected data-i18n="formCategoryPlaceholder"></option>
                            </select>
                        </label>
                        <label class="flex flex-col gap-2 text-start">
                            <span data-i18n="formProduct" class="font-bold text-queen-ink"></span>
                            <select data-quote-product name="product" required class="quote-field">
                                <option value="" disabled selected data-i18n="formProductPlaceholder"></option>
                            </select>
                        </label>
                    </div>
                    <label class="flex flex-col gap-2 text-start">
                        <span data-i18n="formQty" class="font-bold text-queen-ink"></span>
                        <input type="number" min="1" step="1" name="quantity" required data-i18n-placeholder="formQtyPlaceholder" class="quote-field">
                    </label>
                    <div class="grid gap-5 sm:grid-cols-2">
                        <label class="flex flex-col gap-2 text-start">
                            <span data-i18n="formName" class="font-bold text-queen-ink"></span>
                            <input type="text" name="name" required minlength="2" autocomplete="name" class="quote-field">
                        </label>
                        <label class="flex flex-col gap-2 text-start">
                            <span data-i18n="formEmail" class="font-bold text-queen-ink"></span>
                            <input type="email" name="email" required autocomplete="email" dir="ltr" class="quote-field text-start">
                        </label>
                    </div>
                    <label class="flex flex-col gap-2 text-start">
                        <span data-i18n="formPhone" class="font-bold text-queen-ink"></span>
                        <input type="tel" name="phone" required minlength="6" autocomplete="tel" dir="ltr" class="quote-field text-start">
                    </label>
                    <input type="text" name="company" tabindex="-1" autocomplete="off" aria-hidden="true" class="hidden">
                    <button data-quote-submit type="submit" data-i18n="formSubmit" class="mt-1 inline-flex items-center justify-center rounded-full bg-queen-gold px-8 py-3 font-bold text-queen-ink transition hover:bg-yellow-400 disabled:cursor-not-allowed disabled:opacity-60"></button>
                    <p data-quote-status hidden role="status" aria-live="polite" class="rounded-lg px-4 py-3 text-center font-bold"></p>
                </form>
            </div>
        </section>
    </main>
    <site-footer></site-footer>
    <script src="./assets/components.js"></script>
    <script src="./assets/site.js"></script>
    <script src="./assets/animations.js"></script>
    <script src="./assets/quote-form.js"></script>
</body>
</html>

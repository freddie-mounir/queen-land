<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="">
    <title>سياسة الخصوصية | كوين لاند جروب</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Cairo', 'sans-serif'] }, colors: { queen: { gold: '#f7c800', ink: '#232323', body: '#6f6f6f', mist: '#f7f9fb', footer: '#1c1c1c' } } } } };
    </script>
    <link rel="stylesheet" href="./assets/site.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script>
        (function () {
            if (window.gsap && window.ScrollTrigger && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                document.documentElement.classList.add('gsap-init');
                setTimeout(function () { document.documentElement.classList.remove('gsap-init'); }, 3000);
            }
        })();
    </script>
</head>
<body class="antialiased" data-page="privacy" data-page-title="privacyPageTitle" data-page-description="privacyPageDescription">
    <site-header></site-header>
    <main class="pt-20">
        <section class="hero-section flex min-h-[42vh] items-center justify-center px-4 text-center">
            <div class="max-w-4xl py-16">
                <p data-i18n="privacy" class="mb-3 font-bold text-queen-gold"></p>
                <h1 data-i18n="privacyPageIntro" class="mb-5 text-4xl font-extrabold text-white md:text-6xl"></h1>
            </div>
        </section>
        <section class="bg-white px-4 py-20 sm:px-6">
            <div class="mx-auto max-w-3xl rounded-3xl border border-gray-100 bg-queen-mist px-6 py-12 text-center shadow-sm md:px-12">
                <span class="mx-auto mb-6 flex h-20 w-20 items-center justify-center rounded-full bg-queen-gold/20 text-3xl text-queen-ink">
                    <i class="fa-solid fa-shield-halved" aria-hidden="true"></i>
                </span>
                <p data-i18n="comingSoon" class="mb-3 text-sm font-extrabold uppercase tracking-widest text-queen-gold"></p>
                <h2 data-i18n="pageComingSoonText" class="mb-5 text-2xl font-extrabold leading-relaxed text-queen-ink md:text-3xl"></h2>
                <p data-i18n="pageComingSoonHelp" class="mb-8 leading-7 text-queen-body"></p>
                <a data-i18n="contact" href="./contact.html" class="inline-flex rounded-full bg-queen-gold px-7 py-3 font-bold text-queen-ink transition hover:bg-yellow-400"></a>
            </div>
        </section>
    </main>
    <site-footer></site-footer>
    <script src="./assets/components.js"></script>
    <script src="./assets/site.js"></script>
    <script src="./assets/animations.js"></script>
</body>
</html>
